<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة أجر الساعة من الراتب | أداة مجانية</title>
<meta name="description" content="حوّل راتبك الشهري إلى أجر ساعة ويوم وأسبوع، وقارن بين عرضي عمل بالساعة الحقيقية. مفيدة لتقييم عروض العمل. دون إرسال بيانات.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,'Segoe UI',Arial,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.7;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:1.6rem 1rem;text-align:center}
header h1{font-size:1.5rem}
.tagline{opacity:.92;font-size:.95rem;margin-top:.25rem}
main{flex:1;width:100%;max-width:560px;margin:0 auto;padding:1rem}
.card{background:#fff;border-radius:14px;padding:1.25rem;box-shadow:0 1px 4px rgba(15,23,42,.08);margin-bottom:1rem}
.card h2{font-size:1.1rem;margin-bottom:.4rem;color:#0f766e}
label{display:block;font-weight:700;margin:.75rem 0 .3rem}
input,select,textarea{width:100%;padding:.7rem .8rem;border:1.5px solid #cbd5e1;border-radius:10px;font-size:1rem;font-family:inherit;background:#fff;color:#1e293b}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0f766e;box-shadow:0 0 0 3px rgba(20,184,166,.18)}
.row{display:flex;gap:.6rem}
.row>*{flex:1;min-width:0}
button{display:inline-block;width:100%;padding:.8rem;border:0;border-radius:10px;background:#0f766e;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:1rem}
button:hover{background:#115e59}
button.ghost{background:#e2e8f0;color:#1e293b}
.result{background:#ecfdf5;border:1.5px solid #6ee7b7;border-radius:10px;padding:1rem;margin-top:1rem;font-size:1.05rem;word-break:break-word}
.result b{color:#047857}
.result.warn{background:#fffbeb;border-color:#fcd34d}
.result.warn b{color:#b45309}
.result.bad{background:#fef2f2;border-color:#fca5a5}
.result.bad b{color:#b91c1c}
.muted{color:#64748b;font-size:.85rem}
footer{background:#0f172a;color:#94a3b8;text-align:center;padding:1.2rem 1rem;font-size:.85rem;line-height:1.9}
footer a{color:#5eead4}
table{width:100%;border-collapse:collapse;margin-top:.5rem}
th,td{padding:.5rem;border-bottom:1px solid #e2e8f0;text-align:right;font-size:.95rem}
.big{font-size:1.6rem;font-weight:800}
.hidden{display:none}
.chk{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
.chk input{width:auto}

</style>
</head>
<body>
<header>
<h1>حاسبة أجر الساعة</h1>
<p class="tagline">راتبك الشهري يساوي كام في الساعة فعلًا؟ وقارن بين عرضين</p>
</header>
<main>
<div class="card">
<h2>عرض العمل الأول</h2>
<label for="sal1">الراتب الشهري (جنيه)</label>
<input type="number" inputmode="decimal" id="sal1" min="0" placeholder="6000">
<div class="row">
<div>
<label for="days1">أيام العمل أسبوعيًا</label>
<input type="number" inputmode="numeric" id="days1" min="1" max="7" value="5">
</div>
<div>
<label for="hours1">ساعات العمل يوميًا</label>
<input type="number" inputmode="numeric" id="hours1" min="1" max="16" value="8">
</div>
</div>
</div>
<div class="card">
<h2>عرض ثانٍ للمقارنة (اختياري)</h2>
<label for="sal2">الراتب الشهري (جنيه)</label>
<input type="number" inputmode="decimal" id="sal2" min="0" placeholder="اتركه فارغًا إن لم يوجد">
<div class="row">
<div>
<label for="days2">أيام العمل أسبوعيًا</label>
<input type="number" inputmode="numeric" id="days2" min="1" max="7" value="6">
</div>
<div>
<label for="hours2">ساعات العمل يوميًا</label>
<input type="number" inputmode="numeric" id="hours2" min="1" max="16" value="8">
</div>
</div>
<button onclick="calc()">احسب وقارن</button>
</div>
<div id="out" class="result hidden"></div>

</main>
<footer>
<p>تعمل هذه الأداة بالكامل على جهازك، ولا تُحفظ أو تُرسل أي بيانات إلى أي خادم.</p>
<p>أداة مجانية مفتوحة المصدر · بُنيت بمساعدة أدوات ذكاء اصطناعي · <a href="https://github.com/abood-ayman/hourly-wage-ar">الكود على GitHub</a></p>
</footer>
<script>
window.__jserrors=[];window.addEventListener('error',function(e){window.__jserrors.push(String(e.message))});
const g = id => document.getElementById(id);
const fmt = x => x.toLocaleString('ar-EG', { maximumFractionDigits: 2 }) + ' جنيه';

const WEEKS_PER_MONTH = 52 / 12;

function wage(salary, daysPerWeek, hoursPerDay) {
  if (salary <= 0 || daysPerWeek <= 0 || hoursPerDay <= 0) return null;
  const hourly = salary / (daysPerWeek * hoursPerDay * WEEKS_PER_MONTH);
  const daily = hourly * hoursPerDay;
  const weekly = daily * daysPerWeek;
  return { hourly, daily, weekly, monthly: salary, yearly: salary * 12, hoursPerMonth: daysPerWeek * hoursPerDay * WEEKS_PER_MONTH };
}

function wageCard(title, w) {
  return '<p><b>' + title + '</b></p>' +
    '<p class="big">أجر الساعة: <b>' + fmt(w.hourly) + '</b></p>' +
    '<p>اليوم: <b>' + fmt(w.daily) + '</b> · الأسبوع: <b>' + fmt(w.weekly) + '</b></p>' +
    '<p class="muted">ساعات العمل الشهرية: ' + Math.round(w.hoursPerMonth) + ' ساعة</p>';
}

function calc() {
  const s1 = parseFloat(g('sal1').value), d1 = parseFloat(g('days1').value), h1 = parseFloat(g('hours1').value);
  const s2 = parseFloat(g('sal2').value), d2 = parseFloat(g('days2').value), h2 = parseFloat(g('hours2').value);
  const el = g('out');
  el.classList.remove('hidden');
  const w1 = wage(s1, d1, h1);
  if (!w1) { el.innerHTML = '<p>أدخل راتب العرض الأول وساعاته.</p>'; return; }
  let html = wageCard('العرض الأول', w1);
  const w2 = wage(s2, d2, h2);
  if (w2) {
    html += '<hr style="margin:.8rem 0;border:none;border-top:1px solid #6ee7b7">' + wageCard('العرض الثاني', w2);
    const diff = w1.hourly - w2.hourly;
    html += '<p style="margin-top:.5rem"><b>' + (Math.abs(diff) < 0.005 ? 'العرضان متساويان بالساعة.' :
      (diff > 0 ? 'العرض الأول' : 'العرض الثاني') + ' أفضل بالساعة بفارق ' + fmt(Math.abs(diff)) + ' للساعة.') + '</b></p>';
  }
  el.innerHTML = html;
}

window.__test = function () {
  const w = wage(6000, 5, 8);
  const ok = w && Math.abs(w.hourly - 34.6154) < 0.01 &&
             Math.abs(w.daily - 276.923) < 0.01 &&
             Math.abs(w.weekly - 1384.615) < 0.01 &&
             w.yearly === 72000 && wage(0, 5, 8) === null;
  return { pass: ok, details: w };
};

window.__demo = function () {
  g('sal1').value = 5000; g('days1').value = 5; g('hours1').value = 9;
  g('sal2').value = 7000; g('days2').value = 6; g('hours2').value = 9;
  calc();
};

</script>
</body>
</html>
